{% extends "base.html" %}
{% block title %}Application Submitted{% endblock %}
{% block content %}
<div class="thank-you">
  <div class="thank-you-icon">✅</div>
  <h1>Application Submitted!</h1>
  <p>Thank you, <strong>{{ applicant_name }}</strong>. Your Small Business Recovery Grant
     application has been received.</p>
  <p class="ref">Reference ID: <code>{{ session_id }}</code></p>
  <a href="/" class="btn btn-secondary">Return Home</a>
</div>
{% endblock %}
