<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PaperPilot{% endblock %} — Small Business Recovery Grant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,400;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,700&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20260830d">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">
        <span class="logo-icon">✈</span>
        <span class="logo-text">PaperPilot</span>
      </a>
      <nav class="site-nav">
        <a href="/dashboard">Dashboard</a>
        <a href="#about">About</a>
        <a href="/form/" class="nav-cta">Apply Now →</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="footer-brand">PaperPilot</span>
      <div class="footer-links">
        <a href="https://github.com/webmachinelearning/webmcp" target="_blank" rel="noopener">WebMCP Spec</a>
        <a href="https://developer.chrome.com/docs/ai/webmcp" target="_blank" rel="noopener">Chrome Docs</a>
        <a href="https://webmcp.devpost.com/" target="_blank" rel="noopener">The Challenge</a>
      </div>
    </div>
  </footer>

  <script src="/static/webmcp-tools.js?v=20260830d" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
