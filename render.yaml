services:
  - type: web
    name: paperpilot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: COOKIE_SECURE
        value: "true"
      # SECRET_KEY — set in Render dashboard if generateValue is not used
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        generateValue: true
    autoDeploy: true
    healthCheckPath: /
